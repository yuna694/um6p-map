<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>UM6P Rabat - Navigator Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css' rel='stylesheet' />
    
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.3.1/mapbox-gl-directions.js"></script>
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.3.1/mapbox-gl-directions.css" type="text/css">

    <style>
        :root {
            --um6p-red: #B22019; 
            --um6p-white: #FFFFFF;
            --um6p-dark: #1F1F1F;
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* --- PROFESSIONAL SIDEBAR --- */
        .ui-sidebar {
            position: absolute; top: 15px; left: 15px; z-index: 100;
            display: flex; flex-direction: column; gap: 10px; width: 280px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }

        .ui-sidebar.hidden {
            transform: translateX(-350px);
            opacity: 0;
            pointer-events: none;
        }

        /* --- MOBILE TOGGLE BUTTON --- */
        #menu-toggle {
            position: absolute; top: 15px; left: 15px; z-index: 200;
            background: var(--um6p-red); border: 2px solid white; border-radius: 12px;
            width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
            color: white; cursor: pointer; font-size: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        @media (max-width: 600px) {
            .ui-sidebar { width: 200px; top: 75px; left: 15px; }
            #temp-display { font-size: 26px !important; }
        }

        .weather-card {
            background: var(--glass-bg); padding: 20px; border-radius: 20px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.3);
            text-align: center; border-bottom: 4px solid var(--um6p-red);
        }

        .weather-card div[style*="font-size: 10px"] {
            color: var(--um6p-red) !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #temp-display { font-size: 32px; font-weight: 700; color: var(--um6p-dark); margin: 5px 0; }
        #status-display { font-size: 14px; color: #666; margin-bottom: 15px; text-transform: capitalize; }

        #directions-container { display: none; width: 100%; }
        
        .mapbox-directions-instructions { 
            max-height: 200px; 
            overflow-y: auto !important; 
            -webkit-overflow-scrolling: touch;
            background: white !important;
            color: black !important;
            border-radius: 15px;
            display: block !important;
            visibility: visible !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .mapbox-directions-step {
            color: #333 !important;
            padding: 12px !important;
            border-bottom: 1px solid #eee;
        }

        .mapboxgl-ctrl-directions { 
            position: relative !important; margin: 0 !important; width: 100% !important;
            border-radius: 15px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important;
        }

        .control-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        button { 
            cursor: pointer; padding: 12px; border: none; border-radius: 10px; 
            font-weight: bold; font-size: 13px; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        
        #btn-nav-mode { background: var(--um6p-red); color: white; }
        #toggle-theme { background: var(--um6p-dark); color: white; }
        #btn-voice-toggle { background: #e0e0e0; color: #333; }
        #clear-nav { background: #ffeded; color: #d32f2f; }
        #btn-refresh { background: #333; color: white; }

        button:hover { opacity: 0.9; transform: translateY(-2px); }

        .mapboxgl-popup { max-width: 220px !important; }
        .mapboxgl-popup-content { 
            border-radius: 15px; 
            padding: 15px; 
            text-align: center; 
            font-size: 14px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1) !important;
            border-bottom: 3px solid var(--um6p-red);
        }
    </style>
</head>
<body>

<div id="menu-toggle">☰</div>

<div id="map"></div>

<div class="ui-sidebar" id="main-sidebar">
    <div class="weather-card">
        <div style="font-size: 10px; color: #999; letter-spacing: 1px;">UM6P RABAT</div>
        <div id="temp-display">--°C</div>
        <div id="status-display">Syncing...</div>
        <div class="control-buttons">
            <button id="toggle-theme">🌗 Switch View</button>
            <button id="btn-nav-mode">📍 Start Navigation</button>
            <button id="btn-voice-toggle">🔊 Voice: ON</button>
            <button id="btn-reset-points" style="display:none; background:#ffcc80">Reset Selection</button>
            <button id="clear-nav">🗑️ Clear All</button>
            <button id="btn-refresh">🔄 Reload App</button>
        </div>
    </div>
    <div id="directions-container"></div>
</div>

<script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoic2VyZW5hMSIsImEiOiJjbWx3eDU3bjcwbjl1M2hxcXJrcjYxYnY1In0.yUEzPOyRcMoG10lgX_ZE5w';
    
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/standard', 
        center: [-6.7265, 33.9815], 
        zoom: 17.5, pitch: 65, bearing: -25, antialias: true,
        touchZoomRotate: true 
    });

    let navActive = false;
    let navStep = 0; 
    let voiceEnabled = true;
    let lastInstruction = "";

    const menuBtn = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('main-sidebar');

    menuBtn.addEventListener('click', () => {
        sidebar.classList.toggle('hidden');
        menuBtn.innerText = sidebar.classList.contains('hidden') ? '☰' : '✕';
    });

    function speak(text) {
        if (voiceEnabled && 'speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }
    }

    const directions = new MapboxDirections({
        accessToken: mapboxgl.accessToken,
        unit: 'metric',
        profile: 'mapbox/walking',
        interactive: false,
        controls: { inputs: true, instructions: true, profileSwitcher: false }
    });
    
    document.getElementById('directions-container').appendChild(directions.onAdd(map));

    directions.on('route', (e) => {
        const route = e.route[0];
        if (route && route.legs[0]) {
            const steps = route.legs[0].steps;
            if (steps.length > 0) {
                const currentInstruction = steps[0].maneuver.instruction;
                if (currentInstruction !== lastInstruction) {
                    speak(currentInstruction);
                    lastInstruction = currentInstruction;
                }
            }
        }
    });

    map.on('style.load', () => {
        map.setConfigProperty('basemap', 'showTerrain', true);
        const geolocate = new mapboxgl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true,
            showUserLocation: true
        });
        map.addControl(geolocate, 'top-right');
        map.on('load', () => geolocate.trigger());

        map.setConfigProperty('basemap', 'showPointOfInterestLabels', false);
        map.setConfigProperty('basemap', 'showPlaceLabels', false);

        fetch('UM6P-full.geojson').then(res => res.json()).then(data => {
            map.addSource('um6p-src', { type: 'geojson', data: data });
            map.addLayer({
                'id': 'um6p-3d', 'type': 'fill-extrusion', 'source': 'um6p-src',
                'paint': { 
                    'fill-extrusion-color': '#f8f8f8', 
                    'fill-extrusion-height': 15, 
                    'fill-extrusion-opacity': 0.9 
                }
            });
        });
        updateWeather();
    });

    map.on('click', (e) => {
        const features = map.queryRenderedFeatures(e.point, { layers: ['um6p-3d'] });
        const isBuilding = features.length > 0;
        let name = isBuilding ? (features[0].properties.name || "Building") : "Ground/Road";

        if (navActive) {
            document.getElementById('btn-reset-points').style.display = 'block';
            if (navStep === 0) {
                directions.setOrigin([e.lngLat.lng, e.lngLat.lat]);
                new mapboxgl.Popup({ closeButton: false }).setLngLat(e.lngLat).setHTML(`<strong>START:</strong> ${name}`).addTo(map);
                navStep = 1;
                speak("Starting point set.");
            } else if (navStep === 1) {
                directions.setDestination([e.lngLat.lng, e.lngLat.lat]);
                new mapboxgl.Popup({ closeButton: false }).setLngLat(e.lngLat).setHTML(`<strong>END:</strong> ${name}`).addTo(map);
                navStep = 2;
            }
        } else if (isBuilding) {
            new mapboxgl.Popup().setLngLat(e.lngLat).setHTML(`<strong>${name}</strong><br>Levels: ${features[0].properties['building:levels'] || '1'}`).addTo(map);
        }
    });

    document.getElementById('btn-refresh').addEventListener('click', () => { location.reload(); });

    document.getElementById('btn-voice-toggle').addEventListener('click', () => {
        voiceEnabled = !voiceEnabled;
        document.getElementById('btn-voice-toggle').innerText = voiceEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";
        if (!voiceEnabled) window.speechSynthesis.cancel();
    });

    document.getElementById('btn-reset-points').addEventListener('click', () => {
        directions.removeRoutes(); directions.setOrigin(null); directions.setDestination(null);
        navStep = 0; lastInstruction = "";
        const popups = document.getElementsByClassName('mapboxgl-popup');
        while(popups[0]) popups[0].remove();
        document.getElementById('btn-reset-points').style.display = 'none';
    });

    document.getElementById('btn-nav-mode').addEventListener('click', () => {
        navActive = !navActive;
        const container = document.getElementById('directions-container');
        const btn = document.getElementById('btn-nav-mode');
        if (navActive) { 
            container.style.display = 'block'; 
            btn.innerText = "Exit Navigation"; 
            navStep = 0; 
            speak("Navigation activated.");
        } else { 
            container.style.display = 'none'; 
            btn.innerText = "Start Navigation"; 
            window.speechSynthesis.cancel();
        }
    });

    async function updateWeather() {
        try {
            const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=Rabat&units=metric&appid=11a0ec8735949b30f931a0880ed39b60`);
            const data = await res.json();
            document.getElementById('temp-display').innerText = `${Math.round(data.main.temp)}°C`;
            document.getElementById('status-display').innerText = data.weather[0].description;
        } catch(e) { document.getElementById('status-display').innerText = "Weather unavailable"; }
    }

    document.getElementById('toggle-theme').addEventListener('click', () => {
        map.setConfigProperty('basemap', 'lightPreset', (map.getConfigProperty('basemap', 'lightPreset') === 'day') ? 'night' : 'day');
    });

    document.getElementById('clear-nav').addEventListener('click', () => {
        directions.removeRoutes(); directions.setOrigin(null); directions.setDestination(null);
        navStep = 0; lastInstruction = "";
        const popups = document.getElementsByClassName('mapboxgl-popup');
        while(popups[0]) popups[0].remove();
    });
</script>
</body>
</html>
